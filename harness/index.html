<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>home — harness</title><link rel="stylesheet" href="style.css"></head>
<body><div class="stage">
<header class="wmbar"><nav class="ws" aria-label="Workspace layout"><button id="tile" class="cur" aria-pressed="true" title="Tiled workspace">0</button><button id="focus-chat" aria-pressed="false" title="Focus Chat">1</button><span class="dim">2 3 4 5 6 7 8 9</span></nav><h1>HOME · HARNESS</h1><div class="wm-right"><span class="tag">STUB / DEMO</span><time id="clk"></time><button id="reset" title="Propose layout reset">[ reset ]</button></div></header>
<main class="grid" id="grid" aria-label="Harness modules"><section id="chat-slot" class="panel chat" aria-label="Chat module"></section>
<section id="usage-slot" class="panel usage" aria-label="Claude subscription Usage module"></section>
<section class="panel proc preview" aria-label="Launcher design preview"><div class="tbar"><span class="tab on">launch</span><span class="tab">proc</span><span class="rt">DEMO · no process observation</span></div><div class="pbody"><div class="filter"><label for="filter"># filter</label><input id="filter" placeholder="program" autocomplete="off"><span>▸ tree ◂</span></div><div class="prow h"><span>PID</span><span>PROGRAM</span><span>STATE</span><span>CPU</span></div><div class="pr-list" id="processes"></div><div class="src">DEMO values only · run ≠ connected<br>Design preview — no launch, info, or signals capability</div><div class="pfoot"><span><b>select</b></span><span>info</span><span>signals</span><span class="c" id="process-count"></span></div></div></section></main>
<form class="prompt" id="command-form"><span class="ar">▸</span><span class="cur" aria-hidden="true"></span><label for="command" hidden>Chat message or local harness command</label><input id="command" aria-label="Chat message or local harness command" placeholder="ask anything · /help for harness commands" maxlength="8000" autocomplete="off"><button type="submit" id="send">[ send ]</button><kbd class="hint-key">⌘ K</kbd></form>
</div><script type="module" src="shell.js"></script></body></html>
